[pytest]
# Configuração do pytest para o projeto

# Caminho para testes
testpaths = tests

# Padrão de arquivos de teste
python_files = test_*.py

# Padrão de funções de teste
python_functions = test_*

# Padrão de classes de teste
python_classes = Test*

# Verbosidade padrão
addopts = -v --strict-markers --tb=short

# Marcadores customizados
markers =
    unit: Testes unitários
    integration: Testes de integração
    slow: Testes lentos
    database: Testes que usam banco de dados
    models: Testes de modelos de domínio
    security: Testes de segurança
    analytics: Testes de análise
    reporting: Testes de relatórios

# Cobertura de código (se pytest-cov instalado)
# addopts = --cov=src --cov-report=html --cov-report=term-missing

# Timeout padrão para testes (se pytest-timeout instalado)
# timeout = 300

# Mostrar print statements nos testes
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
